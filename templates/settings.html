{% extends "base.html" %}

{% block title %}Einstellungen{% endblock %}

{% block content %}

<h2 class="mb-4">

Firmeneinstellungen

</h2>

<p class="text-muted">Diese Angaben erscheinen auf deinen Rechnungen an Kunden.</p>

<form method="post" enctype="multipart/form-data">

<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="row">

<div class="col-md-6">

<label>Firmenname</label>

<input
class="form-control"
name="company_name"
value="{{ (settings.company_name or '') if settings else '' }}">

</div>

<div class="col-md-6">

<label>Inhaber</label>

<input
class="form-control"
name="owner"
value="{{ (settings.owner or '') if settings else '' }}">

</div>

</div>

<br>

<label>Straße</label>

<input
class="form-control"
name="street"
value="{{ (settings.street or '') if settings else '' }}">

<br>

<div class="row">

<div class="col">

<label>PLZ</label>

<input
class="form-control"
name="zip"
value="{{ (settings.zip or '') if settings else '' }}">

</div>

<div class="col">

<label>Ort</label>

<input
class="form-control"
name="city"
value="{{ (settings.city or '') if settings else '' }}">

</div>

</div>

<br>

<label>E-Mail</label>

<input
class="form-control"
name="email"
value="{{ (settings.email or '') if settings else '' }}">

<br>

<label>Telefon</label>

<input
class="form-control"
name="phone"
value="{{ (settings.phone or '') if settings else '' }}">

<br>

<label>Webseite</label>

<input
class="form-control"
name="website"
value="{{ (settings.website or '') if settings else '' }}">

<br>

<label>USt-ID</label>

<input
class="form-control"
name="vat_id"
value="{{ (settings.vat_id or '') if settings else '' }}">

<br>

<label>IBAN</label>

<input
class="form-control"
name="iban"
value="{{ (settings.iban or '') if settings else '' }}">

<br>

<label>BIC</label>

<input
class="form-control"
name="bic"
value="{{ (settings.bic or '') if settings else '' }}">

<br>

<div class="mb-3">

<label>Firmenlogo</label>

{% if settings and settings.logo %}
<div class="mb-2">
    <img src="{{ url_for('settings.settings_logo', filename=settings.logo) }}" alt="Aktuelles Logo" style="max-height:80px;max-width:200px;display:block;border:1px solid #dee2e6;border-radius:6px;padding:6px;">
</div>
{% endif %}

<input
type="file"
name="logo"
accept="image/png,image/jpeg,image/svg+xml"
class="form-control">

</div>

<button class="btn btn-success">

Speichern

</button>

</form>

{% endblock %}

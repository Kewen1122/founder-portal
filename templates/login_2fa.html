<!DOCTYPE html>

<html lang="de">

<head>

<title>Bestätigungscode</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

<div class="row justify-content-center mt-5">

<div class="col-md-4">

<div class="card">

<div class="card-body">

<h3>Bestätigungscode</h3>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}
<div class="alert alert-{{ category if category != 'message' else 'danger' }}">{{ message }}</div>
{% endfor %}
{% endif %}
{% endwith %}

<p class="text-muted">Code aus deiner Authenticator-App eingeben.</p>

<form method="post">

<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<input
class="form-control mb-3 text-center"
name="code"
inputmode="numeric"
pattern="[0-9]*"
maxlength="6"
autofocus
placeholder="123456">

<button class="btn btn-danger w-100">

Bestätigen

</button>

</form>

<p class="mt-3"><a href="/login">Zurück zum Login</a></p>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
